name: PULSE Italia - filiera editoriale verificata, grafici e AI opzionale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pulse-italia-newsroom.yml"
      - "scripts/pulse_llama_live_probe.py"
      - "scripts/pulse_cloudflare_llama.py"
      - "scripts/pulse_ai_provider.py"
      - "scripts/pulse_editorial_architecture_v2.py"
      - "scripts/pulse_italia_auto_pipeline.py"
      - "tests/test_pulse_editorial_architecture_v2.py"
      - "scripts/pulse_deterministic_writer.py"
      - "tests/test_pulse_deterministic_writer.py"
      - "scripts/pulse_automatic_feature_publish.py"
      - "tests/test_pulse_automatic_feature_publish.py"
  # Run after the morning full radar snapshot, Europe/Rome including DST; once daily to avoid double AI billing.
  schedule:
    - cron: "47 8 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: pulse-data-only
  cancel-in-progress: false

jobs:
  create-review-queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MIT analysis and charting tools
        run: |
          python -m pip install --disable-pip-version-check "dstory==0.12.0" "pandas>=2.0,<3" "numpy>=1.24" "matplotlib>=3.7" beautifulsoup4 openpyxl python-dotenv requests
          git clone --quiet https://github.com/indexcraft/data-analyst-agent.git "$RUNNER_TEMP/data-analyst-agent"
          git -C "$RUNNER_TEMP/data-analyst-agent" checkout --quiet 770e5b5b65e5f38e4144a70a73b07c3653bc5921
          git clone --quiet https://github.com/QinghongLin/data2story-skill.git "$RUNNER_TEMP/data2story-skill"
          git -C "$RUNNER_TEMP/data2story-skill" checkout --quiet 63a55c15f3fac13239263cfa1361fe2ef04d8df1

      - name: Verify evidence and publication protection
        run: |
          python -m unittest discover -s tests -p "test_pulse_italia_official_discovery.py" -v
          python -m unittest discover -s tests -p "test_pulse_auto_sources.py" -v
          python -m unittest discover -s tests -p "test_pulse_data_story_stack.py" -v
          python -m unittest discover -s tests -p "test_editorial_engine_v1.py" -v
          python -m unittest discover -s tests -p "test_pulse_italia_reviewed_publish.py" -v
          python -m unittest discover -s tests -p "test_pulse_llama_live_probe.py" -v
          python -m unittest discover -s tests -p "test_pulse_editorial_architecture_v2.py" -v
          python -m unittest discover -s tests -p "test_pulse_deterministic_writer.py" -v
          python -m unittest discover -s tests -p "test_pulse_automatic_feature_publish.py" -v

      - name: Record explicit AI opt-in without spending any credit
        env:
          PULSE_EDITORIAL_AI_ENABLED: ${{ vars.PULSE_EDITORIAL_AI_ENABLED }}
          PULSE_MISTRAL_API_KEY: ${{ secrets.PULSE_MISTRAL_API_KEY }}
        run: |
          mkdir -p editorial_output
          python - <<'PY'
          import json, os
          from pathlib import Path
          active = os.environ.get("PULSE_EDITORIAL_AI_ENABLED") == "true"
          has_key = bool(os.environ.get("PULSE_MISTRAL_API_KEY", "").strip())
          state = "enabled" if active and has_key else (
              "enabled_but_credentials_missing" if active else "disabled_until_explicit_opt_in")
          Path("editorial_output/ai_readiness.json").write_text(json.dumps({
              "provider": "mistral", "model": "mistral-small-2603",
              "configured": active and has_key, "state": state,
              "production_feed_auto_publish": False
          }, indent=2))
          print("PULSE AI state:", state)
          PY

      - name: Select Italian headlines
        run: |
          mkdir -p editorial_output
          python -m scripts.pulse_italia_newsroom rank \
            --articles data/news/articles.json \
            --output editorial_output/italia_headlines_to_investigate.json \
            --limit 60

      - name: Auto-discover original ISTAT and other Italian authority CSV JSON XLSX from official leads
        run: |
          python -m scripts.pulse_auto_sources \
            --news data/news/articles.json \
            --output-dir editorial_output/discovered_official_files \
            --limit 24

      - name: Reverify official data and create deterministic graphics and audited optional drafts
        env:
          PULSE_AI_PROVIDER: mistral
          PULSE_MISTRAL_API_KEY: ${{ secrets.PULSE_MISTRAL_API_KEY }}
          PULSE_EDITORIAL_AI_ENABLED: ${{ vars.PULSE_EDITORIAL_AI_ENABLED }}
        shell: bash
        run: |
          ai_flags=()
          if [ "$PULSE_EDITORIAL_AI_ENABLED" != "true" ]; then ai_flags+=(--no-ai); fi
          python -m scripts.pulse_italia_auto_pipeline \
            --output-dir editorial_output/official_data_stories \
            --max-sources 30 \
            --external-evidence-dir editorial_output/discovered_official_files/evidence \
            --data-analyst-script "$RUNNER_TEMP/data-analyst-agent/run_analysis.py" \
            --dstory-command dstory \
            --data2story-root "$RUNNER_TEMP/data2story-skill" \
            "${ai_flags[@]}"

      - name: Build the independent source-first architecture and human review queue
        run: |
          python -m scripts.pulse_editorial_architecture_v2 \
            --review-root editorial_output/official_data_stories \
            --output-dir editorial_output/editorial_architecture \
            --headline-file editorial_output/italia_headlines_to_investigate.json \
            --daily-target 30

      - name: Publish verified AI-free statistical features in a SEPARATE Android feed
        run: |
          python -m scripts.pulse_automatic_feature_publish \
            --review-root editorial_output/official_data_stories \
            --output data/news/automatic_features.json | tee editorial_output/automatic_publish_report.json
          git config user.name "PULSE Statistical Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/news/automatic_features.json
          if git diff --cached --quiet; then
            echo "No new verified deterministic features"
          else
            git commit -m "PULSE: release source-verified deterministic statistics (no AI)"
            if ! git push origin HEAD:main; then
              echo "Repository main changed during newsroom run; rebasing own published feed"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi

      - name: Report what actually passed, including exact AI activity
        if: always()
        env:
          PULSE_EDITORIAL_AI_ENABLED: ${{ vars.PULSE_EDITORIAL_AI_ENABLED }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path("editorial_output")
          def doc(path):
              return json.loads(path.read_text()) if path.is_file() else {}
          readiness = doc(base / "ai_readiness.json")
          pipeline = doc(base / "official_data_stories" / "pipeline_report.json")
          queue = doc(base / "editorial_architecture" / "editorial_architecture_report.json")
          auto = doc(base / "automatic_publish_report.json")
          lines = [
              "## PULSE - verified official evidence and editorial preparation",
              "- AI provider: Mistral Small 4 (optional)",
              "- AI opt-in: " + readiness.get("state", "unknown"),
              "- Official numeric source candidates: " + str(pipeline.get("candidate_articles", "not executed")),
              "- Source-and-chart verified editorial briefs: " + str(queue.get("briefs_prepared_for_ai", "not executed")),
              "- Missing against 30-story target: " + str(queue.get("not_written_due_to_lack_of_verified_sources", "not executed")),
              "- Actual AI attempts: " + str(pipeline.get("ai_attempts", 0)),
              "- AI drafts passing independent arithmetic audit: " + str(pipeline.get("ai_audited_drafts", 0)),
              "- Full articles written by restored non-AI engine: " + str(pipeline.get("deterministic_no_ai_drafts", 0)),
              "- Budget reserved (conservative): " + str(pipeline.get("reserved_budget_estimate", 0)) + " " + str(pipeline.get("budget_unit", "unknown")),
              "- New source-audited non-AI features in Android feed: " + str(auto.get("published_new", "not executed")),
              "- Total source-audited features in Android feed: " + str(auto.get("persisted_in_mobile_feed", "not executed")),
              "- AI assisted journalism remains unpublished until human review",
          ]
          print("\\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\\n".join(lines) + "\\n")
          PY

      - name: Preserve review packages, not published news
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-italia-editorial-review
          path: editorial_output/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail explicitly if opted-in Mistral credentials are unavailable
        if: always()
        env:
          PULSE_EDITORIAL_AI_ENABLED: ${{ vars.PULSE_EDITORIAL_AI_ENABLED }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ.get("PULSE_EDITORIAL_AI_ENABLED") == "true":
              p=Path("editorial_output/ai_readiness.json")
              status=json.loads(p.read_text()) if p.is_file() else {}
              if not status.get("configured"):
                  raise SystemExit("Mistral opted in but missing GitHub Actions secret PULSE_MISTRAL_API_KEY")
          PY

# This workflow ONLY produces review artifacts. No model may sign human approval.
# An AI secret alone does not activate billable inference.
