name: PULSE - vecchia redazione disattivata (solo fonti originali)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Riepilogo migrazione
        run: |
          echo "PULSE source-only: articoli generati, AI e grafici editoriali DISATTIVATI."
          echo "L'aggiornamento RSS, le notizie, le pubblicazioni e i territori"
          echo "continuano con pulse-data-daily.yml."
