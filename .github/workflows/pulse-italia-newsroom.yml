name: PULSE Italia - dati ufficiali, grafici e bozze AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pulse-italia-newsroom.yml"
      - "scripts/pulse_llama_live_probe.py"
      - "scripts/pulse_cloudflare_llama.py"
      - "scripts/pulse_ai_provider.py"
      - "scripts/pulse_ai_live_probe.py"
      - "scripts/pulse_editorial_engine_v1.py"
      - "scripts/pulse_italia_auto_pipeline.py"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: pulse-italia-newsroom
  cancel-in-progress: false

jobs:
  create-review-queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MIT analysis and charting tools
        run: |
          python -m pip install --disable-pip-version-check "dstory==0.12.0" "pandas>=2.0,<3" "numpy>=1.24" "matplotlib>=3.7" beautifulsoup4 openpyxl python-dotenv requests
          git clone --quiet https://github.com/indexcraft/data-analyst-agent.git "$RUNNER_TEMP/data-analyst-agent"
          git -C "$RUNNER_TEMP/data-analyst-agent" checkout --quiet 770e5b5b65e5f38e4144a70a73b07c3653bc5921
          git clone --quiet https://github.com/QinghongLin/data2story-skill.git "$RUNNER_TEMP/data2story-skill"
          git -C "$RUNNER_TEMP/data2story-skill" checkout --quiet 63a55c15f3fac13239263cfa1361fe2ef04d8df1

      - name: Verify evidence and publication protection
        run: |
          python -m unittest discover -s tests -p "test_pulse_italia_official_discovery.py" -v
          python -m unittest discover -s tests -p "test_pulse_auto_sources.py" -v
          python -m unittest discover -s tests -p "test_pulse_data_story_stack.py" -v
          python -m unittest discover -s tests -p "test_editorial_engine_v1.py" -v
          python -m unittest discover -s tests -p "test_pulse_italia_reviewed_publish.py" -v
          python -m unittest discover -s tests -p "test_pulse_llama_live_probe.py" -v
          python -m unittest discover -s tests -p "test_pulse_deepseek_provider.py" -v

      - name: Test actual DeepSeek V4.1 Flash inference with authenticated JSON generation
        id: llama_probe
        continue-on-error: true
        env:
          PULSE_AI_PROVIDER: deepseek
          PULSE_DEEPSEEK_API_KEY: ${{ secrets.PULSE_DEEPSEEK_API_KEY }}
        run: |
          mkdir -p editorial_output
          python -m scripts.pulse_ai_live_probe --output editorial_output/ai_connection.json

      - name: Select Italian headlines
        run: |
          mkdir -p editorial_output
          python -m scripts.pulse_italia_newsroom rank \
            --articles data/news/articles.json \
            --output editorial_output/italia_headlines_to_investigate.json \
            --limit 20

      - name: Auto-discover original ISTAT and other Italian authority CSV JSON XLSX from official leads
        run: |
          python -m scripts.pulse_auto_sources \
            --news data/news/articles.json \
            --output-dir editorial_output/discovered_official_files \
            --limit 12

      - name: Recheck official file bytes; analyze series, build charts, tables, narrative drafts
        env:
          PULSE_AI_PROVIDER: deepseek
          PULSE_DEEPSEEK_API_KEY: ${{ secrets.PULSE_DEEPSEEK_API_KEY }}
        run: |
          python -m scripts.pulse_italia_auto_pipeline \
            --output-dir editorial_output/official_data_stories \
            --max-sources 6 \
            --external-evidence-dir editorial_output/discovered_official_files/evidence \
            --data-analyst-script "$RUNNER_TEMP/data-analyst-agent/run_analysis.py" \
            --dstory-command dstory \
            --data2story-root "$RUNNER_TEMP/data2story-skill"

      - name: Show real editorial outcome (no credentials logged)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("editorial_output")
          con = base / "ai_connection.json"
          news = base / "official_data_stories" / "pipeline_report.json"
          cc = json.loads(con.read_text()) if con.exists() else {"status":"no_probe_report"}
          rr = json.loads(news.read_text()) if news.exists() else {}
          lines = [
            "## PULSE newsroom — DeepSeek actual API status",
            "- Authenticated DeepSeek generation: " + cc["status"],
            "- Official statistical candidates: " + str(rr.get("candidate_articles", "not executed")),
            "- DeepSeek editorial attempts: " + str(rr.get("ai_attempts", "not executed")),
            "- DeepSeek drafts passing numeric audit: " + str(rr.get("ai_audited_drafts", "not executed")),
            "- Estimated AI spend (USD peak rates): " + str(rr.get("budget_used_estimate", "not executed")),
            "- Public feed publications by this job: 0 (human approval still required)",
          ]
          print("\n".join(lines))
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Preserve review packages, not published news
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-italia-editorial-review
          path: editorial_output/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark the run unsuccessful when Llama is not actually reachable
        if: steps.llama_probe.outcome == 'failure'
        run: |
          echo "::error::DeepSeek API did not authenticate or generate valid JSON. Add GitHub Actions secret PULSE_DEEPSEEK_API_KEY; see ai_connection.json artifact for safe diagnostic."
          exit 1

# Nothing pushes to the production feed without an independent approval.
# Tommy Worker is not used.
