name: PRAEVOL - discover official ISTAT source paths (read-only)
on:
  push:
    branches: ["feature/praevol-official-projections-2026-11-17"]
    paths:
      - ".github/workflows/praevol-discovery.yml"
      - "scripts/praevol_discovery.py"
      - "scripts/praevol_ppr_refresh.py"
      - "tests/test_praevol_ppr.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -p test_praevol_ppr.py -v
      - run: python scripts/praevol_ppr_refresh.py
      - run: python scripts/praevol_discovery.py
