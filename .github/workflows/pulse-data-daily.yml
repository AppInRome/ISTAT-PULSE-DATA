name: PULSE - aggiorna solo dati e notizie

on:
  # A change to this workflow can run one verification with "news" mode.
  # Ordinary code/data pushes never trigger extra expensive data jobs.
  push:
    paths:
      - ".github/workflows/pulse-data-daily.yml"
  # Eight runs/day, exactly 3h apart in UTC. GitHub may delay a run.
  # Full API refreshes twice/day; news/publications on every run.
  schedule:
    - cron: '17 2,8,11,14,20,23 * * *' # Notizie + Pubblicazioni
    - cron: '17 5,17 * * *'          # Notizie + Green + Territori + Pubblicazioni
  workflow_dispatch:
    inputs:
      mode:
        description: 'Quali dati controllare?'
        type: choice
        required: true
        default: all
        options:
          - all
          - news
          - stats

permissions:
  contents: write

concurrency:
  group: pulse-data-only
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Codice dati (nessuna APK)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dipendenze dati essenziali
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<3' 'scipy<2' 'beautifulsoup4<5' 'requests<3' 'openpyxl<4' 'pypdf<7' 'pdfplumber<1' 'xlrd<3' 'odfpy<2'
      - name: Test redazione originale, grafici e fonti
        run: |
          python -m unittest discover -s tests -p test_original_editorial.py -v
          python -m unittest discover -s tests -p test_quantity_evidence.py -v
          python -m unittest discover -s tests -p test_radar_coverage.py -v
          python -m unittest discover -s tests -p test_media_radar.py -v
          python -m unittest discover -s tests -p test_sectional_news.py -v
          python -m unittest discover -s tests -p test_verified_event_news.py -v
          python -m unittest discover -s tests -p test_casefile_news.py -v
          python -m unittest discover -s tests -p test_news_promotion.py -v
          python -m unittest discover -s tests -p test_sdmx_breaker.py -v
      - name: Convalida snapshot esistente
        run: python scripts/refresh_daily_safe.py --dry-run
      - name: Verifica categorie editoriali
        run: |
          python - <<'PY'
          from scripts.pulse_media_radar import eligible, media_brief
          from scripts.pulse_original_editorial import compose_verified
          from scripts import update_news_radar as radar
          print("PULSE: stampa giornalistica e statistiche verificate sono due categorie distinte")
          print("PULSE: il radar nazionale usa",radar.MAX_ITEMS_PER_FEED,"notizie RSS per feed")
          PY
      - name: Aggiornamento con verifica prima della pubblicazione
        shell: bash
        env:
          MODE_REQUESTED: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode="${MODE_REQUESTED:-all}"
          if [ "${{ github.event_name }}" = "push" ]; then mode=news; fi
          if [ -z "$MODE_REQUESTED" ] && [ "$SCHEDULE" = '17 2,8,11,14,20,23 * * *' ]; then mode=news; fi
          if [ -z "$MODE_REQUESTED" ] && [ "$SCHEDULE" = '17 5,17 * * *' ]; then mode=all; fi
          echo "PULSE DATA mode=$mode"
          python scripts/refresh_daily_safe.py --mode "$mode"
      - name: Controlla integrità OGGI/IERI e divieto di grafici non verificati
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/news')
          ids=json.loads((root/'index.json').read_text())
          by_id={x['id']:x for x in json.loads((root/'articles.json').read_text())['articles']}
          for key in ('oggi','ieri','archivio'):
              values=ids[key]
              assert len(values)==len(set(values)),f'{key}: articoli duplicati'
              for rid in values:
                  article=by_id[rid]
                  if article.get('origin_kind')=='pulse_media_radar':
                      assert article['public_source']['role']=='journalistic_source'
                      assert article['chart_spec']['status']!='verified'
                      assert article['publication_tier']=='reported_by_media_pending_primary_verification'
          print('PULSE OGGI:',len(ids['oggi']),'IERI:',len(ids['ieri']),
                'ARCHIVIO:',len(ids['archivio']))
          PY
      - name: Collaudo offline degli Osservatori
        run: python -m unittest discover -s tests -p test_observer_daily.py -v
      - name: Aggiorna archivio Osservatori da feed ufficiali
        shell: bash
        run: |
          python scripts/update_observer_daily.py
      - name: Pubblica solo i dati effettivamente validati
        shell: bash
        run: |
          git config user.name 'PULSE Data Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/news/articles.json data/news/candidates.json data/news/index.json data/news/editorial_quality_status.json data/news/green_index.json data/news/territori_index.json \
            data/pulse_events.tsv data/pulse_manifest.json data/pulse_observations.tsv \
            data/pulse_observations_manifest.json data/pulse_events_sdmx_last_good.tsv \
            data/pulse_green_status.json data/sources_catalog.json data/refresh_status.json data/live_data_index.json \
            data/news/observer_articles.json data/observer_refresh_status.json
          if git diff --cached --quiet; then echo 'Nessun dato modificato'; exit 0; fi
          git commit -m 'PULSE DATA: aggiornamenti verificati delle fonti'
          # The repository may advance while a 2-10 min source scan is running.
          # Rebase the new validated-data commit onto the latest main, rather
          # than rejecting the whole update with "fetch first". Never force push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Riporta errore se una sezione dati e' incompleta
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path('data/refresh_status.json')
          if not path.exists():
              print('::error::Nessun report dati generato')
              sys.exit(1)
          report = json.loads(path.read_text(encoding='utf-8'))
          bad = [(name, section.get('status'))
                 for name, section in report.get('sections', {}).items()
                 if section.get('last_attempt_at') and
                 section['last_attempt_at'] >= report.get('last_check_at', '') and
                 section.get('status') not in ('ok',)]
          print('Controllo finale sezioni:', report.get('sections'))
          if bad or int(report.get('latest_check_errors', 0)):
              print('::error::Sezioni non aggiornate completamente: ' + str(bad))
              sys.exit(1)
          PY
