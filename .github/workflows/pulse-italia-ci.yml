name: PULSE Italia - Python unit tests
on:
  pull_request:
    paths:
      - "scripts/pulse_italia_newsroom.py"
      - "scripts/pulse_data_story_stack.py"
      - "tests/test_pulse_data_story_stack.py"
      - "tests/fixtures/pulse_italia_integration_manifest.json"
      - "tests/fixtures/pulse_italia_integration_FAKE.csv"
      - "scripts/pulse_editorial_engine_v1.py"
      - "scripts/pulse_editorial_audit_v1.py"
      - "tests/test_pulse_italia_newsroom.py"
      - "tests/test_editorial_engine_v1.py"
      - ".github/workflows/pulse-italia-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated tests, no API keys or publication
        run: |
          python -m unittest discover -s tests -p "test_pulse_italia_newsroom.py" -v
          python -m unittest discover -s tests -p "test_editorial_engine_v1.py" -v
          python -m unittest discover -s tests -p "test_pulse_data_story_stack.py" -v

  external-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned MIT tooling; use no external AI or API
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dstory==0.12.0" "pandas>=2.0,<3" "numpy>=1.24" "matplotlib>=3.7" python-dotenv requests
          git clone --quiet --depth=1 https://github.com/indexcraft/data-analyst-agent.git "$RUNNER_TEMP/data-analyst-agent"
          git -C "$RUNNER_TEMP/data-analyst-agent" checkout --quiet 770e5b5b65e5f38e4144a70a73b07c3653bc5921
          git clone --quiet --depth=1 https://github.com/QinghongLin/data2story-skill.git "$RUNNER_TEMP/data2story-skill"
          git -C "$RUNNER_TEMP/data2story-skill" checkout --quiet 63a55c15f3fac13239263cfa1361fe2ef04d8df1
      - name: Execute all three actual external components offline
        run: |
          python scripts/pulse_data_story_stack.py \
            --manifest tests/fixtures/pulse_italia_integration_manifest.json \
            --source-file tests/fixtures/pulse_italia_integration_FAKE.csv \
            --output-dir "$RUNNER_TEMP/pulse-data-story" \
            --data-analyst-script "$RUNNER_TEMP/data-analyst-agent/run_analysis.py" \
            --dstory-command dstory \
            --data2story-root "$RUNNER_TEMP/data2story-skill" \
            --ai none
          python -c 'import json,os,pathlib; r=json.load(open(pathlib.Path(os.environ["RUNNER_TEMP"])/"pulse-data-story"/"pipeline_status.json")); print(r); assert all(x["status"] == "completed" for x in r["components"].values()); assert r["publish"] is False'
