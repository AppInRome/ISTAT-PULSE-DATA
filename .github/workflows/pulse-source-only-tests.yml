name: PULSE - collaudo radar solo fonti

on:
  push:
    branches:
      - feat/pulse-source-only-radar-20261124
    paths:
      - "scripts/update_news_radar.py"
      - "tests/test_pulse_source_only.py"
      - ".github/workflows/pulse-source-only-tests.yml"
  pull_request:
    paths:
      - "scripts/update_news_radar.py"
      - "tests/test_pulse_source_only.py"
      - ".github/workflows/pulse-source-only-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python -m unittest discover -s tests -p test_pulse_source_only.py -v
      - run: python -m compileall -q scripts/update_news_radar.py
